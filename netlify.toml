[build]
  command = "npm run build"
  publish = "dist"

# Client-side routing: serve the app shell for routes like /social and /settings
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Always fetch the latest service worker so cached builds never get stuck
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
